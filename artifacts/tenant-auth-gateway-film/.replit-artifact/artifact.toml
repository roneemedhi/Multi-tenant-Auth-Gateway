kind = "video"
videoAspectRatio = "16:9"
previewPath = "/tenant-auth-gateway-film/"
title = "Tenant Auth Gateway — Project Film"
description = "A short animated film introducing the multi-tenant authentication gateway, its tenant boundaries, role permissions, revocable sessions, and plan policy."
version = "1.0.0"
id = "artifacts/tenant-auth-gateway-film"
router = "path"

[[services]]
name = "web"
paths = [ "/tenant-auth-gateway-film/" ]
localPort = 20006

[services.development]
run = "pnpm --filter @workspace/tenant-auth-gateway-film run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tenant-auth-gateway-film", "run", "build" ]
serve = "static"
publicDir = "artifacts/tenant-auth-gateway-film/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20006"
BASE_PATH = "/tenant-auth-gateway-film/"
